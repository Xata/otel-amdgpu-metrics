[package]
name = "otel-amdgpu-metrics"
version = "0.1.0"
edition = "2024"
description = "AMD GPU metrics instrumentation for OpenTelemetry"
license = "Apache-2.0"
repository = "https://github.com/Xata/otel-amdgpu-metrics"
keywords = ["opentelemetry", "metrics", "gpu", "amd", "monitoring"]
categories = ["development-tools::profiling"]

[dependencies]
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"

[dev-dependencies]
opentelemetry-stdout = { version = "0.31", features = ["metrics"] }
